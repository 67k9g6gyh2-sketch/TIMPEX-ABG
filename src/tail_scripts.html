<script>
(function () {
  var el = document.getElementById("app-hint"); if (!el) return;
  var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var hosted = location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1";
  el.textContent = standalone ? "Installed app · works offline"
    : hosted ? (isIOS ? "To install: tap Share, then Add to Home Screen. Works offline after the first open."
                      : "To install: browser menu, then Install app or Add to Home screen. Works offline after the first open.")
    : "Running from a file on this device; works offline.";
  if (hosted && "serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
<script>
(function () {
  var KEY = "abgO2.installDismissed";
  var dismissed = false; try { dismissed = localStorage.getItem(KEY) === "1"; } catch (e) {}
  var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var hosted = location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1";
  function dismiss(id) { document.getElementById(id).hidden = true; try { localStorage.setItem(KEY, "1"); } catch (e) {} }
  if (isIOS && hosted && !standalone && !dismissed) document.getElementById("ios-install").hidden = false;
  document.getElementById("ios-install-x").addEventListener("click", function () { dismiss("ios-install"); });
  var deferred = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); deferred = e;
    if (!dismissed && !standalone) document.getElementById("and-install").hidden = false;
  });
  document.getElementById("and-install-go").addEventListener("click", function () {
    if (!deferred) return;
    deferred.prompt();
    var done = function () { document.getElementById("and-install").hidden = true; deferred = null; };
    if (deferred.userChoice && deferred.userChoice.then) deferred.userChoice.then(done, done); else done();
  });
  document.getElementById("and-install-x").addEventListener("click", function () { dismiss("and-install"); });
  window.addEventListener("appinstalled", function () { document.getElementById("and-install").hidden = true; });
})();
</script>
